# Dependabot opens pull requests that update dependencies.
# Updates are grouped so each part of the project gets at most two PRs every 3 days:
# one for all minor/patch updates (usually safe; merge when CI is green) and
# one for major updates (may need code changes; review before merging).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /SARVAS/agent
    schedule:
      interval: cron
      cronjob: "0 9 */3 * *" # every 3 days at 09:00
      timezone: Asia/Kolkata
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      go-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: npm
    directory: /SARVAS/client
    schedule:
      interval: cron
      cronjob: "0 9 */3 * *" # every 3 days at 09:00
      timezone: Asia/Kolkata
    groups:
      client-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      client-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: pip
    directory: /SARVAS/server
    schedule:
      interval: cron
      cronjob: "0 9 */3 * *" # every 3 days at 09:00
      timezone: Asia/Kolkata
    groups:
      server-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      server-major:
        patterns: ["*"]
        update-types: [major]
