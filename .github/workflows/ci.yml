# Same checks as `make lint` and `make test`, split into one job per part.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: SARVAS

jobs:
  agent:
    name: Go agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: SARVAS/agent/go.mod
          cache-dependency-path: SARVAS/agent/go.sum
      - name: gofmt
        working-directory: SARVAS/agent
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        working-directory: SARVAS/agent
        run: go vet ./...
      - name: go test
        working-directory: SARVAS/agent
        run: go test -race ./...
      - name: build
        working-directory: SARVAS/agent
        run: CGO_ENABLED=0 go build -trimpath -o bin/ ./cmd/...

  server:
    name: Python server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SARVAS/server/requirements*.txt
      - name: Install
        run: pip install -r server/requirements-dev.txt
      - name: ruff
        working-directory: SARVAS/server
        run: ruff check . ../scripts
      - name: mypy
        working-directory: SARVAS/server
        run: mypy
      - name: pytest
        working-directory: SARVAS/server
        run: python -m pytest -q tests

  client:
    name: React client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SARVAS/client/package-lock.json
      - name: Install
        working-directory: SARVAS/client
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: SARVAS/client
        run: npm run build
